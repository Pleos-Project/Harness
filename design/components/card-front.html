<!-- 앞면 한 장. 정보 순서: 테마·시간 → 장소명 → 배지 → 이유 한 줄 (명세서 F5).
     data-field 는 contract/openapi.yaml Card 필드, data-derived 는 앱이 Card에서 만들어 넣는 값(RULES.md 2절). -->
<article class="cg-card">
  <img class="cg-card__art" src="../illustrations/river-1.svg" alt="" data-derived="illustration">
  <p class="cg-card__meta"><span data-derived="theme_ko">강</span> · <span data-derived="minutes_text">1시간 10분</span></p>
  <h2 class="cg-card__name" data-field="name">양평 두물머리</h2>
  <span class="cg-badge cg-badge--zero" data-field="display.badge_text">추가 충전 없이 · 여유 50km</span>
  <p class="cg-card__reason" data-field="reason">추가 0원 안 · 75분 안 · 지난번과 다른 테마</p>
  <div class="cg-card__actions">
    <button class="cg-btn cg-btn--ghost" data-action="swap">다른 곳 <span data-derived="swaps_left">2</span></button>
    <button class="cg-btn cg-btn--primary" data-action="go">출발</button>
  </div>
</article>
