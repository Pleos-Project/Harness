openapi: 3.1.0
info:
  title: chagok server
  version: 0.3.0
  description: |
    앱이 부르는 엔드포인트는 /v1/cards, /v1/cards/swap, /v1/prices(평균 단가, 읽기 전용 — 0.3.0 제안).
    /v1/range, /v1/settle 은 검증용 참조 구현 — 앱은 부르지 않는다 (11/5 안건 1).

    원칙 (PRD 5-2, 7-1)
    - 앱은 잔량·주행가능거리·누적 주행거리·VIN 같은 원시 차량값을 보내지 않는다.
      잔고·범위는 앱이 로컬에서 계산하고, 카드에 필요한 파생값(budget)만 보낸다.
    - 서버는 모르는 필드를 422로 거절한다(실수로 원시값이 실려도 받지 않음).
    - 세션은 서버 메모리 30분, 디스크·로그에 남기지 않는다.

    기준 구현: server/chagok/engine.py·cards.py, 앱 로컬·오프라인 데모: app/android/app/src/main/java/com/mist/pleos_app/engine/(Kotlin, FixturesTest로 대조).
    기대값: fixtures/cards/D*.json. 샘플: contract/samples/ (gen_fixtures.py가 생성, 손으로 고치지 않음).
    필드가 바뀌면 이 파일 · 엔진 두 벌 · fixtures 를 같은 PR에서 바꾼다.
servers:
  - url: http://10.0.2.2:8000
    description: 개발용 — 에뮬레이터에서 보는 호스트 PC. 배포는 HTTPS(AC-N-3), app/README.md 네트워크 절 참고
paths:
  /v1/cards:
    post:
      summary: 차가 고른 한 장 + 뒤집힌 스택
      description: |
        session_id 없이 → 새 세션. 고른 프리셋(extra_krw)·테마 안의 후보만 뽑는다(PRD F2·F3 경계).
        session_id 와 함께 → 차량 값이 바뀐 재호출(1초 디바운스). 같은 picked를 유지하고 배지·1인 몫·이유만 새로.
        picked가 +3만 범위를 벗어날 때만 다시 뽑는다. 세션에 이 값을 저장해 이후 교체도 이 값 기준.
        후보가 3곳 미만이면 hint(X2 "범위 안 후보가 적어요")를 준다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardsRequest' }
            examples:
              D1: { externalValue: ./samples/D1.request.json }
              D2_recall: { externalValue: ./samples/D2.recall.request.json }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardsResponse' }
              examples:
                D1: { externalValue: ./samples/D1.response.json }
        '422': { description: 'validation error — 모르는 필드(원시 차량값 등), 프리셋·테마 값 오류' }
  /v1/cards/swap:
    post:
      summary: 교체 (최대 2회). 화면 스택 순서대로 다음 카드
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [session_id]
              properties:
                session_id: { type: string }
                exclude_ids: { type: array, items: { type: string } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id: { type: string }
                  card: { $ref: '#/components/schemas/Card' }
                  swaps_used: { type: integer }
                  swaps_left: { type: integer }
                  stack_left: { type: integer, description: '뒤집힌 스택에 남은 장 수("다른 후보 n")' }
        '404': { description: 'session_not_found (만료 30분 포함) → 앱은 새로 /v1/cards' }
        '409': { description: 'swap_limit 또는 no_more_candidates. detail.hint = "어떤 쪽으로 다시 볼까요?"' }
  /v1/prices:
    get:
      summary: 최신 전국 평균 단가(오피넷, 읽기 전용)
      description: |
        서버가 하루 1회(크론 KST 04:20) 받아 둔 오피넷 전국 평균 판매가격. 사용자 단가가 없을 때 앱이 '평균 단가'로 쓴다.
        - 앱은 받은 값으로 내장 기본값(constants gasoline_krw_per_l)을 갈아 끼운다 → budget.price_source 는 default 그대로, 화면 "평균 단가" 그대로.
        - 입력이 없다. 쿼리 문자열을 붙이면 422 unexpected_query(원시 차량값이 실릴 자리를 두지 않는다, PRD 5-2).
        - 앱은 화면이 보이는 동안 필요할 때만 부른다(앱 실행·복귀 때 1회). 폴링·타이머·백그라운드 호출 금지.
        - 503·타임아웃(3초)·오프라인이면 직전에 받은 값, 그것도 없으면 내장 기본값.
        - 데모 고정 모드(demo_seed)에서는 부르지 않는다(fixtures 기대값이 내장 1,856원 기준).
        - 전기(원/kWh)는 오피넷에 없다 → EV 단가는 지금처럼 앱 설정·내장값.
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Prices' }
              examples:
                opinet: { value: { gasoline: 1855, diesel: 1842, trade_dt: '2026-11-05', source: opinet } }
        '422': { description: 'unexpected_query — 쿼리 문자열이 있음(입력을 받지 않는 엔드포인트)' }
        '503': { description: 'prices_not_ready — 아직 한 번도 못 받음(첫 갱신 전) → 앱은 내장 기본값' }
  /v1/health:
    get:
      responses: { '200': { description: ok } }
components:
  schemas:
    Budget:
      type: object
      additionalProperties: false
      description: 앱 로컬 E1(engine.compute_range) 결과에서 만든 파생값. 원시 잔량·주행가능거리가 아니다.
      required: [fuel_type, usable_km, margin_km, efficiency, price_per_unit]
      properties:
        fuel_type: { type: string, enum: [ev, ice], description: 'AAOS INFO_FUEL_TYPE으로 판별' }
        usable_km: { type: number, description: '잔고 km − 안전 여유 − (1박 30). 음수 가능(추가 0원 불가)' }
        margin_km: { type: number, minimum: 0, description: '안전 여유 = max(50, 잔고 km × 15%). 배지 "여유 {n}km"' }
        efficiency: { type: number, exclusiveMinimum: 0, description: '실연비 km/kWh·km/L (SDK 값, 없으면 차종 표 × 0.85)' }
        price_per_unit: { type: number, exclusiveMinimum: 0, description: '원/kWh·원/L' }
        price_source: { type: string, enum: [user, default], default: user, description: 'default = 사용자 단가 없음 → 전국 평균(GET /v1/prices 값, 못 받으면 앱 내장 기본값) → "평균 단가"' }
    Prices:
      type: object
      additionalProperties: false
      required: [gasoline, diesel, trade_dt, source]
      description: 'GET /v1/prices. 오피넷 avgAllPrice 전국 평균을 서버가 SQLite에 캐시한 값(server/chagok/prices.py)'
      properties:
        gasoline: { type: [integer, 'null'], description: '휘발유(B027) 원/L. 오피넷 값(소수 둘째 자리)을 원 단위 반올림(half up). null = 못 받음' }
        diesel: { type: [integer, 'null'], description: '자동차용경유(D047) 원/L. null = 못 받음' }
        trade_dt: { type: [string, 'null'], format: date, description: '오피넷 기준일 YYYY-MM-DD(두 제품이 다르면 이른 날). 갱신이 실패하면 지난 값이 남아 며칠 지날 수 있다' }
        source: { type: string, const: opinet }
    CardsRequest:
      type: object
      additionalProperties: false
      required: [origin, budget]
      properties:
        origin:
          type: object
          additionalProperties: false
          required: [lat, lng]
          properties: { lat: { type: number }, lng: { type: number } }
          description: 'NaviHelper 현재 위치(없으면 직전 위치 → 설정 집 위치). 서버는 저장하지 않는다'
        budget: { $ref: '#/components/schemas/Budget' }
        seats_occupied: { type: integer, minimum: 1, maximum: 9, default: 1, description: '탄 사람 수(에뮬 반전 처리는 앱 안에서)' }
        extra_krw: { type: integer, enum: [0, 10000, 30000], default: 0 }
        days: { type: integer, enum: [1, 2], default: 1 }
        themes:
          type: array
          maxItems: 2
          items: { type: string, enum: [sea, lake, river, mountain, park, city, island, drive, indoor, festival] }
          description: 'indoor = 박물관·미술관·과학관·아쿠아리움 등(비 오는 날), festival = TourAPI 행사(나들이 날 열리는 것만). [제안] DECISIONS "A1 점수 뼈대"'
        recent_visits: { type: array, maxItems: 10, items: { type: string }, description: '장소 ID, 최근 10개' }
        demo_seed: { type: [string, 'null'] }
        session_id: { type: [string, 'null'] }
    Card:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        theme: { type: string, description: 'sea|lake|river|mountain|park|city|island|drive|indoor|festival = design/illustrations/<theme>-<n>.svg (indoor·festival 일러스트는 아직 없음)' }
        lat: { type: number }
        lng: { type: number }
        route_km: { type: number, description: '편도 도로 거리. 도착 Δodo 0일 때 편도 추정(F17)에 씀' }
        minutes: { type: integer, description: '편도. 90분 넘는 곳은 카드로 오지 않는다' }
        time_label: { type: string, enum: ['75분 안', '조금 먼 곳'] }
        cost:
          type: object
          properties:
            fuel: { type: integer }
            toll: { type: integer }
            parking: { type: [integer, 'null'], description: 'null = 정보 없음' }
            total: { type: integer }
            per_person: { type: [integer, 'null'] }
        display:
          type: object
          description: 온라인에서는 이 문구를 그대로 쓴다. 금액을 다시 계산하지 않는다.
          properties:
            total_text: { type: string, examples: ['1만 원 안팎', '5천 원 미만'] }
            per_person_text: { type: [string, 'null'], examples: ['1인 2천 원 안팎'] }
            zero_extra: { type: boolean }
            tight: { type: boolean }
            ring_krw: { type: integer, enum: [0, 10000, 30000] }
            badge_text: { type: string, examples: ['추가 충전 없이 · 50km 남기고', '추가 주유 없이 · 50km 남기고', '빠듯', '+1만 원 안팎'] }
            margin_km: { type: integer }
        reason: { type: string, examples: ['추가 충전 없이 · 75분 안 · 지난번과 다른 테마', '추가 주유 없이 · 75분 안 · 바다', '해변 · 추가 주유 없이 · 75분 안'] }
        subcategory: { type: string, description: '실서비스 후보만(데모 카드에는 없음). TourAPI 소분류 이름, 예: 해변·수목원·정원·박물관·축제', examples: ['해변'] }
        indoor: { type: boolean, description: '실서비스 후보만. 실내 장소(비 오는 날 위로)' }
        event_start: { type: string, format: date, description: '행사(festival)만. 카드에 기간 표시' }
        event_end: { type: string, format: date }
        rain_level: { type: number, enum: [0.5, 1], description: '나들이 날 목적지 비 예보(기상청 단기예보 9~18시). 비가 없으면 키가 없다' }
    CardsResponse:
      type: object
      properties:
        session_id: { type: [string, 'null'], description: 'picked가 없으면 null' }
        radius_km: { type: number, description: '서버가 쓴 반경(앱 화면 반경과 같아야 함, 대조용)' }
        candidates_in_range: { type: integer, description: '고른 프리셋·테마 안 후보 수' }
        hint:
          type: [object, 'null']
          properties:
            code: { type: string, enum: [few_candidates, rain_outdoor] }
            text: { type: string, examples: ['범위 안 후보가 적어요', '비 소식이 있어요. 실내로 바꿔 볼까요?'] }
            actions: { type: array, items: { type: string, enum: [clear_themes, extra_10000, extra_30000, theme_indoor] } }
          description: 'few_candidates가 먼저. rain_outdoor = 야외 테마를 골랐는데 앞면 카드 목적지에 비 예보(0.5 이상) → 실내 테마로 바꾸기 제안'
        picked: { oneOf: [{ $ref: '#/components/schemas/Card' }, { type: 'null' }] }
        stack: { type: array, items: { $ref: '#/components/schemas/Card' }, maxItems: 3 }
