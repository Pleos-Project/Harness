openapi: 3.1.0
info:
  title: chagok server
  version: 0.5.0
  description: |
    운전 노고 정산(명세 v0.5, #46): 앱이 부르는 엔드포인트는 두 가지다.
    - GET /v1/weather (0.4.0): 출발·도착 지점의 강수 형태(명세 v0.5 12절)
    - GET /v1/places (0.5.0): 출발 화면 목적지 검색, 카카오 로컬 키워드 검색 대행(노고 PRD v1.3 8장, #56)
    노고·금액·제안은 앱 로컬에서 계산한다. 좌표·검색어는 그 조회에만 쓰고 서버는 저장·캐시·로그하지 않는다(AC-N-4).

    아래 /v1/cards, /v1/cards/swap, /v1/prices 는 피봇 전 흐름이다. 정리 방법은 따로 정하고 그때까지 남겨 둔다
    (DECISIONS 11/7 '다음 PR로 넘김' ④). /v1/range, /v1/settle 은 검증용 참조 구현 — 앱은 부르지 않는다 (11/5 안건 1).

    원칙 (PRD 5-2, 7-1)
    - 앱은 잔량·주행가능거리·누적 주행거리·VIN 같은 원시 차량값을 보내지 않는다.
      잔고·범위는 앱이 로컬에서 계산하고, 카드에 필요한 파생값(budget)만 보낸다.
    - 서버는 모르는 필드를 422로 거절한다(실수로 원시값이 실려도 받지 않음).
    - 세션은 서버 메모리 30분, 디스크·로그에 남기지 않는다.

    기준 구현: server/chagok/engine.py·cards.py, 앱 로컬·오프라인 데모: app/android/app/src/main/java/com/mist/pleos_app/engine/(Kotlin, FixturesTest로 대조).
    기대값: fixtures/cards/D*.json. 샘플: contract/samples/ (gen_fixtures.py가 생성, 손으로 고치지 않음).
    필드가 바뀌면 이 파일 · 엔진 두 벌 · fixtures 를 같은 PR에서 바꾼다.
servers:
  - url: http://10.0.2.2:8000
    description: 개발용 — 에뮬레이터에서 보는 호스트 PC. 배포는 HTTPS(AC-N-3), app/README.md 네트워크 절 참고
paths:
  /v1/weather:
    get:
      summary: 한 지점의 지금 강수 형태 (기상청 초단기실황 PTY)
      description: |
        명세 v0.5 F20(출발 지점 → weather_dep)·F22(도착 지점 → weather_arr), 7절 강수 판정, 12절.
        - 앱은 출발 때 출발 지점, 도착 때 도착 지점으로 한 번씩 부른다. 폴링·재시도 타이머·백그라운드 호출 금지.
        - 서버는 좌표를 기상청 격자(nx, ny)로 바꿔 초단기실황(getUltraSrtNcst)을 한 번 부른다.
          발표분은 KST 기준, 매시 10분 이후면 그 시각 정시분, 그 전이면 한 시간 전 정시분(초단기실황 제공 시각, 11/7 실측).
        - 판정: PTY 1·4·5 → rain(4 = 소나기), 2·3·6·7 → snow, 0 → none.
        - 실패는 모두 200 + unknown: 서버 키 없음, 격자 밖(국외), 연결 실패, 기상청 오류 코드·XML 오류,
          3초 초과, 위에 없는 PTY 값. 앱도 3초 안에 못 받거나, 연결이 안 되거나, 200이 아니거나, unknown이면
          그 지점을 '정보 없음'(가산 0)으로 두고 출발·도착을 이어 간다(AC-C-6).
        - 좌표는 이 조회에만 쓴다. 서버는 좌표를 저장·캐시·로그하지 않는다(AC-N-4). 응답은 Cache-Control: no-store —
          URL에 좌표가 들어가므로 앱 HTTP 캐시에도 남기지 않는다.
        - 쿼리는 lat·lon 둘뿐. 다른 쿼리(누적 주행거리·VIN 같은 원시 차량값 등)가 붙으면 422.
        - 서버 구현: server/chagok/weather.py. 키는 공공데이터포털 계정 인증키(TOURAPI_SERVICE_KEY)를 같이 쓴다.
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number, minimum: -90, maximum: 90 }
          description: 위도(WGS84). NaN·Infinity는 422
          example: 37.4127
        - name: lon
          in: query
          required: true
          schema: { type: number, minimum: -180, maximum: 180 }
          description: 경도(WGS84). NaN·Infinity는 422
          example: 127.0947
      responses:
        '200':
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Weather' }
              examples:
                rain: { externalValue: ./samples/weather.rain.response.json }
                unknown: { externalValue: ./samples/weather.unknown.response.json }
        '422': { description: 'validation error — lat·lon 없음·범위 밖·숫자 아님, 또는 모르는 쿼리(원시 차량값 등)' }
  /v1/places:
    get:
      summary: 목적지 검색 (카카오 로컬 키워드 검색 대행, 최대 10곳)
      description: |
        노고 PRD v1.3 8장 출발 화면: 목적지 = 검색 또는 최근 목적지. 지도에서 찍기는 1차 제외. NaviHelper에는 검색 API가 없다(June, #51).
        - 앱은 사용자가 검색을 실행할 때 한 번 부른다. 글자마다 부르지 않는다. 폴링·타이머·백그라운드 호출 금지.
        - 고른 결과의 name·address·lat·lng·place_id를 그대로 requestRoute(RouteInfo)에 넘긴다
          (poiName·address·latitude·longitude·poiId). 서버는 좌표를 고치거나 반올림하지 않는다.
        - 현재 위치(lat·lng)를 같이 보내면 가까운 곳이 위로 온다. 서버는 카카오에 x·y와 sort=accuracy로 넘긴다:
          이름이 분명한 곳('두물머리')은 그곳이 먼저, 체인('스타벅스')은 가까운 지점이 먼저 나온다.
          sort=distance(순수 거리순)는 '두물머리'에서 근처 '두물머리해장국'이 먼저 나와 쓰지 않는다(11/7 실호출).
          lat·lng는 둘 다 보내거나 둘 다 뺀다. 현재 위치를 못 읽으면 빼고 보낸다(정확도순).
        - status: ok(결과 1곳 이상) · empty(검색은 됐고 결과 없음) · unavailable(서버 키 없음·연결 실패·카카오 오류·3초 초과).
          셋 다 200이다. 앱은 3초 안에 못 받거나, 연결이 안 되거나, 200이 아니면 unavailable과 같게 다룬다
          → 최근 목적지에서 고르거나 다시 검색. 출발 화면을 막지 않는다.
          앱 표시(명준 #57): empty → "검색 결과 없음"(검색어를 바꿔 보게), unavailable → 최근 목적지·즐겨찾기에서 고르기로 바로 안내.
          정확한 문구·배치는 디자인.
        - 검색어·현재 위치·결과는 저장·캐시·로그하지 않는다(AC-N-4). 응답은 Cache-Control: no-store
          (URL에 검색어·좌표가 들어가므로 앱 HTTP 캐시에도 남기지 않는다).
        - 쿼리는 query·lat·lng뿐. 다른 쿼리(원시 차량값, 날씨의 lon 등)가 붙으면 422.
        - 서버 구현: server/chagok/places.py. 키는 카카오 REST 키(KAKAO_REST_API_KEY)를 길찾기와 같이 쓴다.
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
          description: 검색어. 앞뒤 공백은 지우고 센다(공백뿐이면 422)
          example: 두물머리
        - name: lat
          in: query
          required: false
          schema: { type: number, minimum: -90, maximum: 90 }
          description: 현재 위치 위도(WGS84, 선택). lng와 같이. 앱은 소수 둘째 자리(약 1km)로 반올림해 보낸다(June #57). NaN·Infinity는 422
          example: 37.4127
        - name: lng
          in: query
          required: false
          schema: { type: number, minimum: -180, maximum: 180 }
          description: 현재 위치 경도(WGS84, 선택). lat와 같이. 앱은 소수 둘째 자리(약 1km)로 반올림해 보낸다. NaN·Infinity는 422
          example: 127.0947
      responses:
        '200':
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Places' }
              examples:
                ok: { externalValue: ./samples/places.ok.response.json }
                empty: { externalValue: ./samples/places.empty.response.json }
                unavailable: { externalValue: ./samples/places.unavailable.response.json }
        '422': { description: 'validation error — query 없음·공백뿐·100자 초과, lat·lng 중 하나만, 범위 밖·숫자 아님, 또는 모르는 쿼리' }
  /v1/cards:
    post:
      summary: 차가 고른 한 장 + 뒤집힌 스택
      description: |
        session_id 없이 → 새 세션. 고른 프리셋(extra_krw)·테마 안의 후보만 뽑는다(PRD F2·F3 경계).
        session_id 와 함께 → 차량 값이 바뀐 재호출(1초 디바운스). 같은 picked를 유지하고 배지·1인 몫·이유만 새로.
        picked가 +3만 범위를 벗어날 때만 다시 뽑는다. 세션에 이 값을 저장해 이후 교체도 이 값 기준.
        후보가 3곳 미만이면 hint(X2 "범위 안 후보가 적어요")를 준다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardsRequest' }
            examples:
              D1: { externalValue: ./samples/D1.request.json }
              D2_recall: { externalValue: ./samples/D2.recall.request.json }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardsResponse' }
              examples:
                D1: { externalValue: ./samples/D1.response.json }
        '422': { description: 'validation error — 모르는 필드(원시 차량값 등), 프리셋·테마 값 오류' }
  /v1/cards/swap:
    post:
      summary: 교체 (최대 2회). 화면 스택 순서대로 다음 카드
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [session_id]
              properties:
                session_id: { type: string }
                exclude_ids: { type: array, items: { type: string } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id: { type: string }
                  card: { $ref: '#/components/schemas/Card' }
                  swaps_used: { type: integer }
                  swaps_left: { type: integer }
                  stack_left: { type: integer, description: '뒤집힌 스택에 남은 장 수("다른 후보 n")' }
        '404': { description: 'session_not_found (만료 30분 포함) → 앱은 새로 /v1/cards' }
        '409': { description: 'swap_limit 또는 no_more_candidates. detail.hint = "테마를 바꿔 볼까요?"' }
  /v1/prices:
    get:
      summary: 최신 전국 평균 단가(오피넷, 읽기 전용)
      description: |
        서버가 하루 1회(크론 KST 04:20) 받아 둔 오피넷 전국 평균 판매가격. 사용자 단가가 없을 때 앱이 '평균 단가'로 쓴다.
        - 앱은 받은 값으로 내장 기본값(constants gasoline_krw_per_l)을 갈아 끼운다 → budget.price_source 는 default 그대로, 화면 "평균 단가" 그대로.
        - 입력이 없다. 쿼리 문자열을 붙이면 422 unexpected_query(원시 차량값이 실릴 자리를 두지 않는다, PRD 5-2).
        - 앱은 화면이 보이는 동안 필요할 때만 부른다(앱 실행·복귀 때 1회). 폴링·타이머·백그라운드 호출 금지.
        - 503·타임아웃(3초)·오프라인이면 직전에 받은 값, 그것도 없으면 내장 기본값.
        - 데모 고정 모드(demo_seed)에서는 부르지 않는다(fixtures 기대값이 내장 1,856원 기준).
        - 전기(원/kWh)는 오피넷에 없다 → EV 단가는 지금처럼 앱 설정·내장값.
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Prices' }
              examples:
                opinet: { value: { gasoline: 1855, diesel: 1842, trade_dt: '2026-11-05', source: opinet } }
        '422': { description: 'unexpected_query — 쿼리 문자열이 있음(입력을 받지 않는 엔드포인트)' }
        '503': { description: 'prices_not_ready — 아직 한 번도 못 받음(첫 갱신 전) → 앱은 내장 기본값' }
  /v1/health:
    get:
      responses: { '200': { description: ok } }
components:
  schemas:
    Place:
      type: object
      additionalProperties: false
      required: [name, address, lat, lng, place_id, category, distance_m]
      description: '카카오 로컬 장소 하나. 앱은 RouteInfo(poiName=name, address, latitude=lat, longitude=lng, poiId=place_id)로 넘긴다'
      properties:
        name: { type: string, description: '카카오 place_name', examples: ['두물머리'] }
        address: { type: string, description: '도로명 주소, 없으면 지번 주소(빈 문자열일 수 있음)', examples: ['경기 양평군 양서면 양수리'] }
        lat: { type: number, description: '위도(카카오 y)' }
        lng: { type: number, description: '경도(카카오 x)' }
        place_id: { type: string, description: '카카오 장소 id(숫자 문자열)', examples: ['7845373'] }
        category:
          type: [string, 'null']
          description: '카카오 category_name의 마지막 칸("여행 > 관광,명소" → "관광,명소"). 이름이 비슷한 결과를 목록에서 구분하는 데 쓴다. 분류가 없으면 null'
          examples: ['관광,명소', '패스트푸드', '주차장']
        distance_m:
          type: [integer, 'null']
          minimum: 0
          description: '현재 위치에서의 거리(m, 카카오 distance). 현재 위치(lat·lng)를 안 보냈으면 null'
          examples: [23671]
    Places:
      type: object
      additionalProperties: false
      required: [status, places]
      description: 'GET /v1/places. 앱은 고른 장소의 이름(dest_name)만 출발 기록에 남긴다. 좌표는 남기지 않는다(AC-N-4)'
      properties:
        status:
          type: string
          enum: [ok, empty, unavailable]
          description: 'ok 결과 있음 · empty 결과 없음 · unavailable 검색 실패(키 없음·연결 실패·카카오 오류·3초 초과). unavailable·empty면 places는 []'
        places:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/Place' }
          description: '카카오가 준 순서 그대로(현재 위치를 보냈으면 정확도순 + 가까운 곳 우선)'
    Weather:
      type: object
      additionalProperties: false
      required: [precip, observed_at]
      description: 'GET /v1/weather. 앱은 출발 기록에 weather_dep, 도착 때 weather_arr로 precip만 남긴다(좌표는 남기지 않는다)'
      properties:
        precip:
          type: string
          enum: [none, rain, snow, unknown]
          description: 'none 강수 없음 · rain 비(PTY 1·4·5, 소나기 포함) · snow 눈(PTY 2·3·6·7, 비/눈 포함) · unknown 정보 없음(실패 — 가산 0)'
        observed_at:
          type: [string, 'null']
          format: date-time
          description: '기상청 실황 기준 시각(정시, +09:00). 예 2026-11-07T16:00:00+09:00. unknown이면 null'
    Budget:
      type: object
      additionalProperties: false
      description: 앱 로컬 E1(engine.compute_range) 결과에서 만든 파생값. 원시 잔량·주행가능거리가 아니다.
      required: [fuel_type, usable_km, margin_km, efficiency, price_per_unit]
      properties:
        fuel_type: { type: string, enum: [ev, ice], description: 'AAOS INFO_FUEL_TYPE으로 판별' }
        usable_km: { type: number, description: '잔고 km − 안전 여유 − (1박 30). 음수 가능(추가 0원 불가)' }
        margin_km: { type: number, minimum: 0, description: '안전 여유 = max(50, 잔고 km × 15%). 배지 "여유 {n}km"' }
        efficiency: { type: number, exclusiveMinimum: 0, description: '실연비 km/kWh·km/L (SDK 값, 없으면 차종 표 × 0.85)' }
        price_per_unit: { type: number, exclusiveMinimum: 0, description: '원/kWh·원/L' }
        price_source: { type: string, enum: [user, default], default: user, description: 'default = 사용자 단가 없음 → 전국 평균(GET /v1/prices 값, 못 받으면 앱 내장 기본값) → "평균 단가"' }
    Prices:
      type: object
      additionalProperties: false
      required: [gasoline, diesel, trade_dt, source]
      description: 'GET /v1/prices. 오피넷 avgAllPrice 전국 평균을 서버가 SQLite에 캐시한 값(server/chagok/prices.py)'
      properties:
        gasoline: { type: [integer, 'null'], description: '휘발유(B027) 원/L. 오피넷 값(소수 둘째 자리)을 원 단위 반올림(half up). null = 못 받음' }
        diesel: { type: [integer, 'null'], description: '자동차용경유(D047) 원/L. null = 못 받음' }
        trade_dt: { type: [string, 'null'], format: date, description: '오피넷 기준일 YYYY-MM-DD(두 제품이 다르면 이른 날). 갱신이 실패하면 지난 값이 남아 며칠 지날 수 있다' }
        source: { type: string, const: opinet }
    CardsRequest:
      type: object
      additionalProperties: false
      required: [origin, budget]
      properties:
        origin:
          type: object
          additionalProperties: false
          required: [lat, lng]
          properties: { lat: { type: number }, lng: { type: number } }
          description: 'NaviHelper 현재 위치(없으면 직전 위치 → 설정 집 위치). 서버는 저장하지 않는다'
        budget: { $ref: '#/components/schemas/Budget' }
        seats_occupied: { type: integer, minimum: 1, maximum: 9, default: 1, description: '탄 사람 수(에뮬 반전 처리는 앱 안에서)' }
        extra_krw: { type: integer, enum: [0, 10000, 30000], default: 0 }
        days: { type: integer, enum: [1, 2], default: 1 }
        themes:
          type: array
          maxItems: 2
          items: { type: string, enum: [sea, lake, river, mountain, park, city, island, drive] }
        recent_visits: { type: array, maxItems: 10, items: { type: string }, description: '장소 ID, 최근 10개' }
        demo_seed: { type: [string, 'null'] }
        session_id: { type: [string, 'null'] }
    Card:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        theme: { type: string, description: 'sea|lake|river|mountain|park|city|island|drive = design/illustrations/<theme>-<n>.svg' }
        lat: { type: number }
        lng: { type: number }
        route_km: { type: number, description: '편도 도로 거리. 도착 Δodo 0일 때 편도 추정(F17)에 씀' }
        minutes: { type: integer, description: '편도. 90분 넘는 곳은 카드로 오지 않는다' }
        time_label: { type: string, enum: ['75분 안', '조금 먼 곳'] }
        cost:
          type: object
          properties:
            fuel: { type: integer }
            toll: { type: integer }
            parking: { type: [integer, 'null'], description: 'null = 정보 없음' }
            total: { type: integer }
            per_person: { type: [integer, 'null'] }
        display:
          type: object
          description: 온라인에서는 이 문구를 그대로 쓴다. 금액을 다시 계산하지 않는다.
          properties:
            total_text: { type: string, examples: ['1만 원 안팎', '5천 원 미만'] }
            per_person_text: { type: [string, 'null'], examples: ['1인 2천 원 안팎'] }
            zero_extra: { type: boolean }
            tight: { type: boolean }
            ring_krw: { type: integer, enum: [0, 10000, 30000] }
            badge_text: { type: string, examples: ['추가 충전 없이 · 여유 50km', '빠듯', '+1만 원 안팎'] }
            margin_km: { type: integer }
        reason: { type: string, examples: ['추가 0원 안 · 75분 안 · 지난번과 다른 테마'] }
    CardsResponse:
      type: object
      properties:
        session_id: { type: [string, 'null'], description: 'picked가 없으면 null' }
        radius_km: { type: number, description: '서버가 쓴 반경(앱 화면 반경과 같아야 함, 대조용)' }
        candidates_in_range: { type: integer, description: '고른 프리셋·테마 안 후보 수' }
        hint:
          type: [object, 'null']
          properties:
            code: { type: string, enum: [few_candidates] }
            text: { type: string, examples: ['범위 안 후보가 적어요'] }
            actions: { type: array, items: { type: string, enum: [clear_themes, extra_10000, extra_30000] } }
        picked: { oneOf: [{ $ref: '#/components/schemas/Card' }, { type: 'null' }] }
        stack: { type: array, items: { $ref: '#/components/schemas/Card' }, maxItems: 3 }
