<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>차곡</title>
<style>
  :root { --u: 1px; }
  body { margin: 0; padding: 24px; font-family: "Asta Sans", system-ui, "Noto Sans KR", sans-serif;
         background: #131417; color: #fff; font-size: calc(26 * var(--u)); line-height: calc(34 * var(--u)); }
  @media (prefers-color-scheme: light) { body { background: #fff; color: #131417; } }
  code { opacity: .7; }
</style>
</head>
<body>
<!-- 빌드 환경 확인용. 엔진(chagok/engine.js)이 실렸는지만 보여 준다. 앱 화면은 여기에 짓는다. -->
<p>빌드 환경 확인</p>
<p id="engine">엔진을 읽는 중</p>
<script src="chagok/engine.js"></script>
<script>
  // 디자인 가이드 px(디스플레이 실제 픽셀) → CSS px
  document.documentElement.style.setProperty('--u', (1 / window.devicePixelRatio) + 'px');
  const el = document.getElementById('engine');
  if (window.ChagokEngine) {
    const E = window.ChagokEngine;
    const v = { fuel_type: 'ev', level_pct: 80, capacity: 77.4, efficiency: 6.2 * 0.85, price_per_unit: 300, remaining_range_m: 326000, price_source: 'user' };
    el.textContent = '엔진 OK · ' + E.computeRange(v).balance_text;
  } else {
    el.textContent = '엔진 없음 — Gradle syncChagokEngine 확인';
  }
</script>
</body>
</html>
